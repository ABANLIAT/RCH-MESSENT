<script>
"use strict";
/* =====================================================================
   RECHERCHE DE FUITE — appli téléphone des techniciens (MESSENT)
   - lit donnees_fuites.json (écrit par l'appli bureau) sur le SharePoint
   - écrit dans le dossier de l'intervention :
       PHOTOS/<CATEGORIE>_<date>_<xx>.jpg

   ===================================================================== */

const DEMO = /[?&]demo=1/.test(location.search) || CFG.clientId === "A_REMPLIR" && /[?&]demo/.test(location.search);

    { id: "c_lant", l: "Lanterneaux / exutoires / coupoles", a: "Costières, joints, dômes fissurés" },

    { id: "detailTest", t: "texte", l: "Détail des tests (zone, durée, résultat)", ph: "ex. arrosage EP nord 20 min → eau au plafond après 10 min" }

    { id: "origine", t: "plusieurs", l: "Origine", o: ["Évacuation EP", "Relevé", "Joint / recouvrement", "Membrane percée / fissurée", "Traversée / équipement", "Lanterneau", "Acrotère / couvertine", "Joint de dilatation", "Seuil", "Façade / menuiserie", "Condensation", "Autre"] },

    { id: "precos", t: "plusieurs", l: "Ce qu'il faudrait faire", o: ["Nettoyage / entretien EP", "Réparation ponctuelle", "Reprise des relevés", "Réfection partielle", "Réfection complète", "Investigation complémentaire", "Voir façade / menuiserie"] },

/* ---------- état ---------- */
let msalApp = null, compte = null, driveId = null;
let DATA = null;           // donnees_fuites.json
let MOI = localStorage.getItem("rdf_moi") || "";
let vueCourante = "accueil", dossierId = null, ongletDossier = "infos";
let photoCatEnCours = null, photoPointEnCours = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => (s == null ? "" : String(s)).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const pad = (n) => (n < 10 ? "0" : "") + n;
const fmtDate = (iso) => iso ? iso.split("-").reverse().join("/") : "";
const jour = (iso) => ["dim.", "lun.", "mar.", "mer.", "jeu.", "ven.", "sam."][new Date(iso + "T12:00").getDay()];
const today = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const nowISO = () => { const d = new Date(); return today() + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds()); };
const slug = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase().replace(/[^A-Z0-9]+/g, "_").replace(/^_|_$/g, "");
function toast(t, ms) { const el = $("toast"); el.innerHTML = t; el.style.display = "block"; clearTimeout(el._t); el._t = setTimeout(() => el.style.display = "none", ms || 3000); }

/* ---------- stockage local (IndexedDB) : file d'envoi + aperçus photos ---------- */
let db = null;
function ouvrirDB() {
  return new Promise((ok, ko) => {
    const r = indexedDB.open("rdf", 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore("file", { keyPath: "path" }); d.createObjectStore("apercus", { keyPath: "id" }); };
    r.onsuccess = () => { db = r.result; ok(); };
    r.onerror = () => ko(r.error);
  });
}
const MEM = { file: new Map(), apercus: new Map() };   // secours si IndexedDB indisponible (démo ouverte en fichier)
function idbMem(store, fn) {
  const m = MEM[store], k = store === "file" ? "path" : "id";
  const st = { put: (o) => { m.set(o[k], o); return {}; }, getAll: () => ({ result: Array.from(m.values()) }), delete: (x) => { m.delete(x); return {}; }, get: (x) => ({ result: m.get(x) }) };
  const r = fn(st); return Promise.resolve(r && r.result);

  const an = d.date.substring(0, 4), cat = /agence|syndic/i.test(d.typeClient) ? "AGENCES" : /particulier/i.test(d.typeClient) ? "PARTICULIERS" : "ENTREPRISES";
  let p = (CFG.racineDossiers || "MESSENT ASSISTANCE") + "/" + an + "/RECHERCHE DE FUITE/" + cat;
  if (cat === "AGENCES" && d.client && d.client !== "À COMPLÉTER") p += "/" + propre(d.client);
  const nom = propre((d.ailleurs && d.chantier) || (d.client !== "À COMPLÉTER" ? d.client : "") || d.adChantier || d.adresse).substring(0, 60);
  return p + "/" + nom + " - " + d.date.split("-").reverse().join("-");
}
async function ndCreer(maintenant) {
  const n = new Date(), id = "t" + n.getTime().toString(36) + Math.random().toString(36).slice(2, 5);
  const agence = ND.type !== "Particulier";
  const note = [ND.symptomes.join(", "), ND.texte.trim()].filter(Boolean).join(" — ");
  const d = { id, cree: today(), date: today(), origine: "Téléphone (technicien)", depuisTel: true, aCompleter: true, creePar: MOI,
    typeClient: ND.type || "Particulier", client: ND.client.trim() || "À COMPLÉTER", contact: ND.contact.trim(), tel: "", mail: "",
    adresse: agence ? "" : ND.adresse.trim(), ailleurs: agence, chantier: agence ? ND.residence.trim() : "", adChantier: agence ? ND.adresse.trim() : "",
    batiment: ND.complement.trim(), contactSite: ND.sur.trim(), telSite: ND.telSur.trim(), urgence: !!ND.urgent, note, gps: ND.gps || "",
    tech: maintenant ? MOI : "", tech2: "", datePrevue: maintenant ? today() : "", heure: maintenant ? pad(n.getHours()) + "h" + pad(n.getMinutes()) : "",
    programme: maintenant, sa: "" };
  if (maintenant) d.dossier = "SP:" + cheminNouveauDossier(d).replace(/\//g, "\\");
  const a = demandesLocales(); a.push(d); sauverDemandesLocales(a);
  const blob = new Blob([JSON.stringify(d, null, 1)], { type: "application/json" });
  await fileAjouter({ path: (CFG.demandesPath || "MESSENT ASSISTANCE/APPLICATION/RECHERCHE DE FUITE/DEMANDES TELEPHONE") + "/" + id + ".json", blob, type: "application/json", genre: "demande", ajout: Date.now() });
  if (maintenant) { const e = etat(id); e.debut = nowISO(); localStorage.setItem(cleEtat(id), JSON.stringify(e)); await mettreFicheEnFile(id); }
  localStorage.removeItem("rdf_nd_brouillon");
  ND = { etape: 6, id, maintenant }; majFile(); traiterFile(); rendre(); window.scrollTo(0, 0);
}

/* ---------- démarrage ---------- */
(async function demarrer() {
  if (DEMO) $("demo-band").style.display = "block";
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
  try { await ouvrirDB(); } catch (e) { if (!DEMO) { afficherErreur("Stockage du téléphone indisponible."); return; } db = null; }
  const ok = await initAuth();
  if (!DEMO && !ok) { if (msalApp) { vueCourante = "connexion"; rendre(); } return; }
  if (!(await chargerDonnees())) return;
  if (MOI && DATA.techniciens.indexOf(MOI) < 0) MOI = "";
  vueCourante = MOI ? "liste" : "nom";
  rendre(); majFile(); traiterFile();
})();
